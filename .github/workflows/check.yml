# Reusable check gate — typecheck + tests. Called by ci.yml (every PR, #57) and by
# release.yml (before any publish, #56), so the gate is defined exactly once.
name: check

on:
  workflow_call: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck
      - name: Tests (bun test)
        run: bun test
