# Release pipelines (#56 / REQ-073).
#   develop-reachable tag  -> pre-release (SemVer with a -pre component, e.g. v0.1.0-b.1)
#   main-reachable tag     -> full release (plain SemVer, e.g. v0.1.0)
# package.json is the source of truth: the tag must match it, and the channel must match the
# tag's pre-release status. Binaries for all platforms cross-compile from one Linux job.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + branch refs, for reachability checks
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install

      - name: Determine channel from branch reachability
        id: channel
        run: |
          set -euo pipefail
          git fetch --quiet origin main develop
          tag_sha="$(git rev-list -n1 "${GITHUB_REF_NAME}")"
          # main takes precedence: a tag on main is a release even though it is also in develop.
          if git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "$tag_sha" origin/develop; then
            echo "channel=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tag ${GITHUB_REF_NAME} is not reachable from main or develop; refusing to release."
            exit 1
          fi

      - name: Validate version (SemVer, matches package.json, matches channel)
        id: version
        run: bun scripts/release-version.ts "${GITHUB_REF_NAME}" "${{ steps.channel.outputs.channel }}" >> "$GITHUB_OUTPUT"

      - name: Build all platform binaries
        run: bun scripts/build-all.ts "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail

          # Refuse to publish nothing. `dist/*` would otherwise expand to the literal string
          # under `set -u`, and gh would report something unrelated to the real problem.
          shopt -s nullglob
          artifacts=(dist/*)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "::error::no artifacts in dist/ — the build step produced nothing to publish."
            exit 1
          fi

          # This step must be IDEMPOTENT, because there are two ways a tag comes into existence
          # and only one of them leaves the release un-created:
          #
          #   git push origin vX.Y.Z        -> tag exists, no release yet  -> create
          #   "Draft a new release" in the UI -> creating the release CREATES the tag, which
          #                                      triggers this workflow   -> release ALREADY exists
          #
          # The second path is not exotic — it is the obvious thing to do from the web UI, and it
          # is how the first real run of this pipeline failed: every build succeeded and then
          # `gh release create` aborted with "a release with the same tag name already exists",
          # leaving a release with no binaries attached and nothing to show for the work.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — attaching artifacts and reconciling the channel."
            # --clobber so a re-run replaces artifacts rather than failing on a name collision.
            gh release upload "$TAG" "${artifacts[@]}" --clobber
            # Reconcile the pre-release flag: a release created by hand may carry the wrong
            # channel, and release-version.ts has already proved which one the tag means from the
            # tag's SemVer and its branch reachability. Notes are left alone deliberately — a
            # human may have written them, and they are not ours to overwrite.
            #
            # `--prerelease=false` is pflag's explicit-value form for a bool flag; `gh release
            # edit --help` documents only the bare `--prerelease`, and there is no
            # `--no-prerelease`. If a future gh rejects the form, this step fails loudly under
            # `set -e` rather than silently leaving the release on the wrong channel — which is
            # the right way round for a publish path.
            gh release edit "$TAG" --prerelease="$PRERELEASE"
          else
            create_flags=(--title "$TAG" --generate-notes)
            if [ "$PRERELEASE" = "true" ]; then create_flags+=(--prerelease); fi
            gh release create "$TAG" "${artifacts[@]}" "${create_flags[@]}"
          fi

          echo "published ${#artifacts[@]} artifact(s) to $TAG (prerelease=$PRERELEASE)"
