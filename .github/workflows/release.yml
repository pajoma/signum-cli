# Release pipelines (#56 / REQ-073).
#   develop-reachable tag  -> pre-release (SemVer with a -pre component, e.g. v0.1.0-b.1)
#   main-reachable tag     -> full release (plain SemVer, e.g. v0.1.0)
# package.json is the source of truth: the tag must match it, and the channel must match the
# tag's pre-release status. Binaries for all platforms cross-compile from one Linux job.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + branch refs, for reachability checks
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install

      - name: Determine channel from branch reachability
        id: channel
        run: |
          set -euo pipefail
          git fetch --quiet origin main develop
          tag_sha="$(git rev-list -n1 "${GITHUB_REF_NAME}")"
          # main takes precedence: a tag on main is a release even though it is also in develop.
          if git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "$tag_sha" origin/develop; then
            echo "channel=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tag ${GITHUB_REF_NAME} is not reachable from main or develop; refusing to release."
            exit 1
          fi

      - name: Validate version (SemVer, matches package.json, matches channel)
        id: version
        run: bun scripts/release-version.ts "${GITHUB_REF_NAME}" "${{ steps.channel.outputs.channel }}" >> "$GITHUB_OUTPUT"

      - name: Build all platform binaries
        run: bun scripts/build-all.ts "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--title "${GITHUB_REF_NAME}" --generate-notes)
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" dist/* "${flags[@]}"
